name: Refresh official holidays and deploy
on:
  schedule:
    - cron: "17 3 10 * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      KASI_SERVICE_KEY: ${{ secrets.KASI_SERVICE_KEY }}
      VITE_BASE_PATH: /weekflow/
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Fetch all months; retain each last complete year on failure
        run: npm run holidays
      - name: Commit only verified public JSON
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/holidays/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh official KASI holiday cache'
            git push
          fi
      - run: npm run build
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - uses: actions/deploy-pages@v5.0.1
